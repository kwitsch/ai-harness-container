name: Build and tag Docker images

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed image VERSION files
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          NULL_SHA="0000000000000000000000000000000000000000"
          BEFORE="$BEFORE_SHA"

          if [ "$BEFORE" = "$NULL_SHA" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              BEFORE="HEAD~1"
            else
              echo "images=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          CHANGED_FILES="$(git diff --name-only "$BEFORE" "$AFTER_SHA" | grep -E '^images/[^/]+/VERSION$' || true)"
          IMAGES="$(printf '%s\n' "$CHANGED_FILES" | awk -F/ 'NF==3 {print $2}' | sort -u)"

          if [ -z "$IMAGES" ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
          else
            JSON="$(printf '%s\n' "$IMAGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            echo "images=$JSON" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: ${{ needs.detect.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < "images/$IMAGE/VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute registry names
        id: names
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.image }}:${{ steps.version.outputs.version }}

      - name: Tag release commit
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${IMAGE}-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"
