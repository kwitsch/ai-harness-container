name: Build and tag Docker images

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - name: Detect changed image VERSION files
        id: changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          NULL_SHA="0000000000000000000000000000000000000000"

          if [ "$BEFORE_SHA" = "$NULL_SHA" ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! FILES="$(gh api "repos/${{ github.repository }}/compare/${BEFORE_SHA}...${AFTER_SHA}" --paginate --jq '.files[] | select(.status != "removed") | .filename' 2>&1)"; then
            echo "::warning::compare API failed for ${BEFORE_SHA}...${AFTER_SHA}; treating as no changes ($FILES)"
            echo "images=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMAGES="$(printf '%s\n' "$FILES" | grep -E '^images/[^/]+/VERSION$' | awk -F/ 'NF==3 {print $2}' | sort -u)"

          if [ -z "$IMAGES" ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DUP_LOWER="$(printf '%s\n' "$IMAGES" | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"
          if [ -n "$DUP_LOWER" ]; then
            echo "::error::Case-variant image directories collide on the same registry name: $DUP_LOWER"
            exit 1
          fi

          JSON="$(printf '%s\n' "$IMAGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "images=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < "images/$IMAGE/VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute registry names
        id: names
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Tag release commit
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${IMAGE}-${VERSION}"
          EXISTING_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}' | head -n1)"
          if [ -n "$EXISTING_SHA" ]; then
            if [ "$EXISTING_SHA" = "${{ github.sha }}" ]; then
              echo "Tag $TAG already points at ${{ github.sha }}; nothing to do."
              exit 0
            fi
            echo "::error::Tag $TAG already exists at $EXISTING_SHA, which is not the current commit ${{ github.sha }} — refusing to move it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"
